services:
  network-router:
    image: alpine
    container_name: network-router
    restart: unless-stopped
    privileged: true
    ports:
      - "10.10.1.130:8889:8888" # config Web
      - "10.10.1.130:8026:8025" #config Mail
    command:
      - sh
      - -c
      - |
        set -eu

        apk add --no-cache iptables iproute2 grep tcpdump
        mkdir -p /var/log/router
        touch /var/log/router/router.log
        echo 1 > /proc/sys/net/ipv4/ip_forward

        EXTERNAL_IF=$$(ip route show default | awk '{print $$5; exit}')
        EXTERNAL_IF=$${EXTERNAL_IF:-eth0}
        printf '%s prefix=ROUTER_INIT message="router logging started" IN=%s\n' "$$(date '+%Y-%m-%dT%H:%M:%S%z')" "$$EXTERNAL_IF" >> /var/log/router/router.log

        while ! ping -c 1 crapi-web >/dev/null 2>&1; do sleep 2; done
        while ! ping -c 1 mailhog >/dev/null 2>&1; do sleep 2; done

        WEB_IP=$$(ping -c 1 crapi-web | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
        MAIL_IP=$$(ping -c 1 mailhog | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
        printf '%s prefix=ROUTER_INIT message="resolved services" WEB_IP=%s MAIL_IP=%s\n' "$$(date '+%Y-%m-%dT%H:%M:%S%z')" "$$WEB_IP" "$$MAIL_IP" >> /var/log/router/router.log

        iptables -t mangle -A PREROUTING -p tcp --dport 8888 -j LOG --log-prefix "CRAPI_WEB_IN " --log-level 4 || printf '%s prefix=ROUTER_WARN message="iptables LOG unavailable" target=CRAPI_WEB_IN\n' "$$(date '+%Y-%m-%dT%H:%M:%S%z')" >> /var/log/router/router.log
        iptables -t mangle -A PREROUTING -p tcp --dport 8025 -j LOG --log-prefix "CRAPI_MAIL_IN " --log-level 4 || printf '%s prefix=ROUTER_WARN message="iptables LOG unavailable" target=CRAPI_MAIL_IN\n' "$$(date '+%Y-%m-%dT%H:%M:%S%z')" >> /var/log/router/router.log
        iptables -t nat -A PREROUTING -p tcp --dport 8888 -j DNAT --to-destination $$WEB_IP:80
        iptables -t nat -A PREROUTING -p tcp --dport 8025 -j DNAT --to-destination $$MAIL_IP:8025
        iptables -t nat -A POSTROUTING -j MASQUERADE

        tcpdump -i "$$EXTERNAL_IF" -nn -l 'tcp and (dst port 8888 or dst port 8025)' 2>> /var/log/router/router.log |
        awk -v capture_if="$$EXTERNAL_IF" '{
          ip_idx=0
          for (i=1; i<=NF; i++) {
            if ($$i == "IP" || $$i == "IP6") {
              ip_idx=i
              break
            }
          }
          if (ip_idx == 0) {
            next
          }

          iface = capture_if
          src = $$(ip_idx + 1)
          dst = $$(ip_idx + 3)
          sub(/:$$/, "", dst)
          sub(/\.$$/, "", dst)

          spt = ""
          dpt = ""
          n = split(src, s, ".")
          if (n >= 5) {
            spt = s[n]
            src = s[1] "." s[2] "." s[3] "." s[4]
          }
          n = split(dst, d, ".")
          if (n >= 5) {
            dpt = d[n]
            dst = d[1] "." d[2] "." d[3] "." d[4]
          }

          prefix = "CRAPI_ROUTER_IN"
          if (dpt == "8888") {
            prefix = "CRAPI_WEB_IN"
          } else if (dpt == "8025") {
            prefix = "CRAPI_MAIL_IN"
          }

          print strftime("%Y-%m-%dT%H:%M:%S%z") " prefix=" prefix " SRC=" src " DST=" dst " PROTO=TCP SPT=" spt " DPT=" dpt " IN=" iface
          fflush()
        }' >> /var/log/router/router.log &

        tail -f /var/log/router/router.log
    volumes:
      - router-logs:/var/log/router
    networks:
      - external_net
      - dmz_net
  crapi-web:
    container_name: crapi-web
    image: crapi/crapi-web:${VERSION:-latest}
    environment:
      - COMMUNITY_SERVICE=crapi-community:${COMMUNITY_SERVER_PORT:-8087}
      - IDENTITY_SERVICE=crapi-identity:${IDENTITY_SERVER_PORT:-8080}
      - WORKSHOP_SERVICE=crapi-workshop:${WORKSHOP_SERVER_PORT:-8000}
      - CHATBOT_SERVICE=crapi-chatbot:${CHATBOT_SERVER_PORT:-5002}
      - MAILHOG_WEB_SERVICE=mailhog:8025
      - TLS_ENABLED=${TLS_ENABLED:-false}
    depends_on:
      crapi-community:
        condition: service_healthy
      crapi-identity:
        condition: service_healthy
      crapi-workshop:
        condition: service_healthy
    healthcheck:
      test: curl 0.0.0.0:80/health
      interval: 15s
      timeout: 15s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M
    volumes:
      - type: bind
        source: ./logs/crapi-web
        target: /usr/local/openresty/nginx/logs
        bind:
          create_host_path: false   # Äáº©y log vÃ o volume áº£o
    networks:
      - dmz_net
      - backend_net

  mailhog:
    user: root
    container_name: mailhog
    image: crapi/mailhog:${VERSION:-latest}
    environment:
      MH_MONGO_URI: admin:crapisecretpassword@mongodb:27017
      MH_STORAGE: mongodb
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "8025" ]
      interval: 15s
      timeout: 15s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M
    networks:
      - dmz_net
      - database_net
  crapi-identity:
    container_name: crapi-identity
    image: crapi/crapi-identity:${VERSION:-latest}
    volumes:
      - type: bind
        source: ./keys
        target: /app/keys
        read_only: true
        bind:
          create_host_path: false

      - type: volume
        source: crapi-identity-logs
        target: /var/log/crapi-identity
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DB_NAME=crapi
      - DB_USER=admin
      - DB_PASSWORD=crapisecretpassword
      - DB_HOST=postgresdb
      - DB_PORT=5432
      - SERVER_PORT=${IDENTITY_SERVER_PORT:-8080}
      - ENABLE_SHELL_INJECTION=${ENABLE_SHELL_INJECTION:-false}
      - JWT_SECRET=crapi
      - MAILHOG_HOST=mailhog
      - MAILHOG_PORT=1025
      - MAILHOG_DOMAIN=example.com
      - SMTP_HOST=smtp.example.com
      - SMTP_PORT=587
      - SMTP_EMAIL=user@example.com
      - SMTP_PASS=xxxxxxxxxxxxxx
      - SMTP_FROM=no-reply@example.com
      - SMTP_AUTH=true
      - SMTP_STARTTLS=true
      - JWT_EXPIRATION=604800000
      - ENABLE_LOG4J=${ENABLE_LOG4J:-false}
      - API_GATEWAY_URL=https://api.mypremiumdealership.com
      - TLS_ENABLED=${TLS_ENABLED:-false}
      - TLS_KEYSTORE_TYPE=PKCS12
      - TLS_KEYSTORE=classpath:certs/server.p12
      - TLS_KEYSTORE_PASSWORD=passw0rd
      - TLS_KEY_PASSWORD=passw0rd
      - TLS_KEY_ALIAS=identity
    depends_on:
      postgresdb:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    healthcheck:
      test: /app/health.sh
      interval: 15s
      timeout: 15s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 384M
    networks:
      - backend_net
      - database_net
      - wazuh_soc_lan

  crapi-community:
    container_name: crapi-community
    image: crapi/crapi-community:${VERSION:-latest}
    volumes:
      - crapi-community-logs:/var/log/crapi-community
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - IDENTITY_SERVICE=crapi-identity:${IDENTITY_SERVER_PORT:-8080}
      - DB_NAME=crapi
      - DB_USER=admin
      - DB_PASSWORD=crapisecretpassword
      - DB_HOST=postgresdb
      - DB_PORT=5432
      - SERVER_PORT=${COMMUNITY_SERVER_PORT:-8087}
      - MONGO_DB_HOST=mongodb
      - MONGO_DB_PORT=27017
      - MONGO_DB_USER=admin
      - MONGO_DB_PASSWORD=crapisecretpassword
      - MONGO_DB_NAME=crapi
      - TLS_ENABLED=${TLS_ENABLED:-false}
      - TLS_CERTIFICATE=certs/server.crt
      - TLS_KEY=certs/server.key
    depends_on:
      postgresdb:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      crapi-identity:
        condition: service_healthy
    healthcheck:
      test: /app/health.sh
      interval: 15s
      timeout: 15s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 192M
    networks:
      - backend_net
      - database_net

  crapi-workshop:
    container_name: crapi-workshop
    image: crapi/crapi-workshop:${VERSION:-latest}
    volumes:
      - crapi-workshop-logs:/var/log/crapi-workshop
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - IDENTITY_SERVICE=crapi-identity:${IDENTITY_SERVER_PORT:-8080}
      - DB_NAME=crapi
      - DB_USER=admin
      - DB_PASSWORD=crapisecretpassword
      - DB_HOST=postgresdb
      - DB_PORT=5432
      - SERVER_PORT=${WORKSHOP_SERVER_PORT:-8000}
      - MONGO_DB_HOST=mongodb
      - MONGO_DB_PORT=27017
      - MONGO_DB_USER=admin
      - MONGO_DB_PASSWORD=crapisecretpassword
      - MONGO_DB_NAME=crapi
      - SECRET_KEY=crapi
      - API_GATEWAY_URL=https://api.mypremiumdealership.com
      - TLS_ENABLED=${TLS_ENABLED:-false}
      - TLS_CERTIFICATE=certs/server.crt
      - TLS_KEY=certs/server.key
      - FILES_LIMIT=1000
    depends_on:
      postgresdb:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      crapi-identity:
        condition: service_healthy
      crapi-community:
        condition: service_healthy
    healthcheck:
      test: /app/health.sh
      interval: 15s
      timeout: 15s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M
    networks:
      - backend_net
      - database_net
  

  crapi-edge-proxy:
    image: nginx:1.27-alpine
    container_name: crapi-edge-proxy
    restart: unless-stopped
    ports:
      - "10.10.1.130:8888:80"
    volumes:
      - type: bind
        source: ./edge-proxy/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./logs/edge-proxy
        target: /var/log/nginx
        bind:
          create_host_path: false

    depends_on:
      crapi-web:
        condition: service_healthy

    networks:
      - external_net
      - dmz_net
  crapi-chatbot:
    container_name: crapi-chatbot
    image: crapi/crapi-chatbot:${VERSION:-latest}
    volumes:
      - crapi-chatbot-logs:/var/log/crapi-chatbot
    environment:
      - TLS_ENABLED=${TLS_ENABLED:-false}
      - SERVER_PORT=${CHATBOT_SERVER_PORT:-5002}
      - WEB_SERVICE=crapi-web
      - IDENTITY_SERVICE=crapi-identity:${IDENTITY_SERVER_PORT:-8080}
      - DB_NAME=crapi
      - DB_USER=admin
      - DB_PASSWORD=crapisecretpassword
      - DB_HOST=postgresdb
      - DB_PORT=5432
      - MONGO_DB_HOST=mongodb
      - MONGO_DB_PORT=27017
      - MONGO_DB_USER=admin
      - MONGO_DB_PASSWORD=crapisecretpassword
      - MONGO_DB_NAME=crapi
      - API_USER=admin@example.com
      - API_PASSWORD=Admin!123
      - OPENAPI_SPEC=/app/resources/crapi-openapi-spec.json
      - CHATBOT_LLM_PROVIDER=${CHATBOT_LLM_PROVIDER:-openai}
      - CHATBOT_EMBEDDINGS_DIMENSIONS=${CHATBOT_EMBEDDINGS_DIMENSIONS:-1536}
      - MAX_CONTENT_LENGTH=50000
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    depends_on:
      mongodb:
        condition: service_healthy
      crapi-identity:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    networks:
      - backend_net
      - database_net

  api.mypremiumdealership.com:
    container_name: api.mypremiumdealership.com
    image: crapi/gateway-service:${VERSION:-latest}
    healthcheck:
      test: bash -c 'echo -n "GET / HTTP/1.1\n\n" > /dev/tcp/127.0.0.1/443'
      interval: 15s
      timeout: 15s
      retries: 15
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 50M
    networks:
      - backend_net
  postgresdb:
    container_name: postgresdb
    image: 'postgres:14'
    command: ["postgres",
	      "-c", "max_connections=500",
	      "-c", "logging_collector=on",
	      "-c", "log_directory=/var/log/postgresql",
              "-c", "log_filename=postgresql.log",
	      "-c", "log_connections=on",
              "-c", "log_disconnections=on",
	      "-c", "log_statement=mod",
	      "-c", "log_min_error_statement=error",
       	"-c", "log_line_prefix=%m [%p] user=%u db=%d app=%a client=%h "
	]
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: crapisecretpassword
      POSTGRES_DB: crapi
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 15s
      timeout: 15s
      retries: 15
    volumes:
      - postgresql-data:/var/lib/postgresql/data/
      - postgres-logs:/var/log/postgresql
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - database_net
      - wazuh_soc_lan

  mongodb:
    container_name: mongodb
    image: 'mongo:4.4'
    command: ["mongod", "--logpath", "/var/log/mongodb/mongod.log", "--logappend", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: crapisecretpassword
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo mongodb:27017/test --quiet
      interval: 15s
      timeout: 15s
      retries: 15
      start_period: 20s
    volumes:
      - mongodb-data:/data/db
      - mongodb-logs:/var/log/mongodb
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M
    networks:
      - database_net

  chromadb:
    container_name: chromadb
    image: 'chromadb/chroma:latest'
    environment:
      IS_PERSISTENT: 'TRUE'
    healthcheck:
      test: [ "CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8000" ]
      interval: 15s
      timeout: 15s
      retries: 15
      start_period: 20s
    volumes:
      - chromadb-data:/data
    networks:
      - database_net

  wazuh-agent-web:
    image: wazuh/wazuh-agent:4.14.4
    container_name: wazuh-agent-web
    hostname: crapi-web-gateway
    restart: unless-stopped
    environment:
      - WAZUH_MANAGER=172.16.1.1
      - WAZUH_REGISTRATION_SERVER=172.16.1.1
      - WAZUH_AGENT_NAME=crapi-web-gateway
      - WAZUH_PROTOCOL=tcp
    volumes:
      - type: bind
        source: ./wazuh-agent/ossec.conf
        target: /var/ossec/etc/ossec.conf
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./logs/edge-proxy
        target: /var/log/nginx_shared
        read_only: true
        bind:
          create_host_path: false


    networks:
      - wazuh_soc_lan

  wazuh-agent-router:
    image: wazuh/wazuh-agent:4.14.4
    container_name: wazuh-agent-router
    hostname: crapi-network-router
    restart: unless-stopped
    environment:
      - WAZUH_MANAGER=172.16.1.1
      - WAZUH_REGISTRATION_SERVER=172.16.1.1
      - WAZUH_AGENT_NAME=crapi-network-router
      - WAZUH_PROTOCOL=tcp
    volumes:
      - type: bind
        source: ./wazuh-agent/router-ossec.conf
        target: /var/ossec/etc/ossec.conf
        read_only: true
        bind:
          create_host_path: false

      - type: volume
        source: router-logs
        target: /var/log/router_shared
        read_only: true

    networks:
      - wazuh_soc_lan

  wazuh-agent-backend:
    image: wazuh/wazuh-agent:4.14.4
    container_name: wazuh-agent-backend
    hostname: crapi-backend-layer
    restart: unless-stopped
    environment:
      - WAZUH_MANAGER=172.16.1.1
      - WAZUH_REGISTRATION_SERVER=172.16.1.1
      - WAZUH_AGENT_NAME=crapi-backend-layer
      - WAZUH_PROTOCOL=tcp
    volumes:
      - type: bind
        source: ./wazuh-agent/backend-ossec.conf
        target: /var/ossec/etc/ossec.conf
        read_only: true
        bind:
          create_host_path: false

      - type: volume
        source: crapi-identity-logs
        target: /var/log/crapi_identity_shared
        read_only: true

      - type: volume
        source: crapi-community-logs
        target: /var/log/crapi_community_shared
        read_only: true

      - type: volume
        source: crapi-workshop-logs
        target: /var/log/crapi_workshop_shared
        read_only: true

      - type: volume
        source: crapi-chatbot-logs
        target: /var/log/crapi_chatbot_shared
        read_only: true

    networks:
      - backend_net
      - wazuh_soc_lan

  wazuh-agent-database:
    image: wazuh/wazuh-agent:4.14.4
    container_name: wazuh-agent-database
    hostname: crapi-database-layer
    restart: unless-stopped
    environment:
      - WAZUH_MANAGER=172.16.1.1
      - WAZUH_REGISTRATION_SERVER=172.16.1.1
      - WAZUH_AGENT_NAME=crapi-database-layer
      - WAZUH_PROTOCOL=tcp
    volumes:
      - type: bind
        source: ./wazuh-agent/database-ossec.conf
        target: /var/ossec/etc/ossec.conf
        read_only: true
        bind:
          create_host_path: false

      - type: volume
        source: postgres-logs
        target: /var/log/postgres_shared
        read_only: true

      - type: volume
        source: mongodb-logs
        target: /var/log/mongodb_shared
        read_only: true

    networks:
      - database_net
      - wazuh_soc_lan

  wazuh-agent-docker:
    image: wazuh/wazuh-agent:4.14.4
    container_name: wazuh-agent-docker
    hostname: crapi-docker-host
    restart: unless-stopped
    environment:
      - WAZUH_MANAGER=172.16.1.1
      - WAZUH_REGISTRATION_SERVER=172.16.1.1
      - WAZUH_AGENT_NAME=crapi-docker-host
      - WAZUH_PROTOCOL=tcp
    volumes:
      - type: bind
        source: ./wazuh-agent/docker-ossec.conf
        target: /var/ossec/etc/ossec.conf
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false


    networks:
      - wazuh_soc_lan
networks:
  external_net:
    driver: bridge
  dmz_net:
    driver: bridge
    internal: true
  backend_net:
    driver: bridge
    internal: true
  database_net:
    driver: bridge
    internal: true

  wazuh_soc_lan:
    driver: bridge
  
volumes:
  mongodb-data:
  postgresql-data:
  chromadb-data:
  router-logs:

  crapi-identity-logs:
  crapi-community-logs:
  crapi-workshop-logs:
  crapi-chatbot-logs:
  postgres-logs:
  mongodb-logs:

