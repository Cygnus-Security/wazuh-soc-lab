<ossec_config>
  <client>
    <server>
      <address>172.16.1.1</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>

    <enrollment>
      <enabled>yes</enabled>
      <manager_address>172.16.1.1</manager_address>
      <port>1515</port>
      <agent_name>crapi-database-layer</agent_name>
    </enrollment>   
  </client>

  <localfile>
    <log_format>postgresql_log</log_format>
    <location>/var/log/postgres_shared/postgresql.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/mongodb_shared/mongod.log</location>
  </localfile>

  
</ossec_config>