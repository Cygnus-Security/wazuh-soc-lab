<ossec_config>
  <client>
    <server>
      <address>172.16.1.1</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>172.16.1.1</manager_address>
      <port>1515</port>
      <agent_name>crapi-docker-host</agent_name>
    </enrollment>
  </client>

  <wodle name="docker-listener">
    <disabled>no</disabled>
    <interval>1m</interval>
    <run_on_start>yes</run_on_start>
  </wodle>

</ossec_config>