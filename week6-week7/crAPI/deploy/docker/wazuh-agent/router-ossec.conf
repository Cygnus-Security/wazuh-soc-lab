<ossec_config>
  <client>
    <server>
      <address>172.16.1.1</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>

    <enrollment>
      <enabled>yes</enabled>
      <manager_address>172.16.1.1</manager_address>
      <port>1515</port>
      <agent_name>crapi-network-router</agent_name>
    </enrollment>
  </client>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/router_shared/router.log</location>
  </localfile>
</ossec_config>
