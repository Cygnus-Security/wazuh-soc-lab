<ossec_config>
  <client>
    <server>
      <address>172.16.1.1</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>

    <enrollment>
      <enabled>yes</enabled>
      <manager_address>172.16.1.1</manager_address>
      <port>1515</port>
      <agent_name>crapi-web-gateway</agent_name>
    </enrollment>
    <config-profile>ubuntu, ubuntu18, ubuntu18.04</config-profile>
  </client>

  <active-response>
    <disabled>no</disabled>
    <ca_store>/var/ossec/etc/wpk_root.pem</ca_store>
    <ca_verification>yes</ca_verification>
  </active-response>

  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/nginx_shared/access.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/nginx_shared/error.log</location>
  </localfile>
</ossec_config>