<ossec_config>
  <client>
    <server>
      <address>172.16.1.1</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>

    <enrollment>
      <enabled>yes</enabled>
      <manager_address>172.16.1.1</manager_address>
      <port>1515</port>
      <agent_name>crapi-backend-layer</agent_name>
    </enrollment>
  </client>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/crapi_identity_shared/*.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/crapi_community_shared/*.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/crapi_workshop_shared/*.log</location>
  </localfile>

  <!-- New: structured security/audit log -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/crapi_audit_shared/*.json</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/crapi_chatbot_shared/*.log</location>
  </localfile>

  

</ossec_config>